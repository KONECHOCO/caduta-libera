<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Last Tile: Trivia Temple</title>
  <meta name="description" content="Last Tile: Trivia Temple. Esplora 10 sale, trova la lastra che regge e decidi se uscire col tesoro o scendere più a fondo.">

  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Last Tile">
  <meta name="theme-color" content="#0d0906">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCENA 3D DEL TEMPIO -->
  <div id="viewport-3d"></div>

  <!-- BARRA SUPERIORE -->
  <header id="top-bar">
    <div class="brand-container">
      <div id="logo-shield" class="logo-shield">
        <span id="logo-text-top" class="logo-text-top">LAST TILE</span>
        <span id="logo-text-bot" class="logo-text-bot">TRIVIA TEMPLE</span>
      </div>
      <div id="mode-tag" class="mode-tag">10 LASTRE · UNA SOLA REGGE</div>
    </div>

    <!-- SALA E TESORO DELLA SPEDIZIONE -->
    <div class="hud-center-cluster">
      <div class="montepremi-display">
        <span id="hall-label" class="hud-label">SALA 1 / 10</span>
        <span class="hud-treasure">
          <span id="bag-label" class="hud-label">TESORO</span>
          <span id="bag-val" class="digital-currency">0</span>
        </span>
      </div>
    </div>

    <div class="hud-right-cluster">
      <div class="quick-controls">
        <div class="lang-selector-box">
          <select id="lang-select" class="ctrl-btn lang-select" title="Language / Lingua">
            <option value="it">🇮🇹 IT</option>
            <option value="en">🇬🇧 EN</option>
            <option value="es">🇪🇸 ES</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="de">🇩🇪 DE</option>
          </select>
        </div>

        <button id="info-rules-btn" class="ctrl-btn">📖 Regole</button>
        <button id="audio-toggle-btn" class="ctrl-btn">🔊 Suono On</button>
        <button id="voice-toggle-btn" class="ctrl-btn">🎙️ Guida On</button>
        <button id="camera-view-btn" class="ctrl-btn">🎥 Visuale</button>
        <button id="pro-btn" class="ctrl-btn pro-btn" title="Pro">👑 PRO</button>
      </div>
    </div>
  </header>

  <main id="main-finale-ui">
    <div id="status-banner" class="status-banner intro"></div>

    <!-- ENIGMA DELLA SALA -->
    <section class="finale-question-card">
      <div class="question-header">
        <div id="finale-category" class="category-pill"></div>
        <div id="hint-pill" class="hint-pill"></div>
      </div>
      <h1 id="finale-question-text" class="question-text"></h1>
    </section>

    <!-- TIMER E AZIONI -->
    <div class="timer-action-strip">
      <div class="timer-wrapper">
        <svg class="timer-svg" viewBox="0 0 100 100">
          <circle class="timer-circle-bg" cx="50" cy="50" r="45"></circle>
          <circle id="timer-circle-progress" class="timer-circle-fg" cx="50" cy="50" r="45"></circle>
        </svg>
        <div class="timer-label-box">
          <span id="timer-display" class="timer-number">45</span>
          <span id="timer-sub" class="timer-sub">SEC</span>
        </div>
      </div>

      <div id="action-buttons-group" class="action-buttons-group">
        <button id="stand-btn" class="tv-action-btn primary" disabled>
          <span class="btn-icon">🧭</span>
          <div class="btn-text-wrap">
            <span class="btn-title"></span>
            <span class="btn-sub"></span>
          </div>
        </button>

        <button id="torch-btn" class="tv-action-btn torch" style="display: none;">
          <span class="btn-icon">🔥</span>
          <div class="btn-text-wrap">
            <span id="torch-title" class="btn-title"></span>
            <span id="torch-sub" class="btn-sub"></span>
          </div>
        </button>

        <button id="hold-btn" class="tv-action-btn keep" style="display: none;">
          <span class="btn-icon">🛡️</span>
          <div class="btn-text-wrap">
            <span class="btn-title"></span>
            <span id="hold-sub" class="btn-sub"></span>
          </div>
        </button>

        <button id="leap-btn" class="tv-action-btn change" style="display: none;">
          <span class="btn-icon">🪢</span>
          <div class="btn-text-wrap">
            <span class="btn-title"></span>
            <span id="leap-sub" class="btn-sub"></span>
          </div>
        </button>
      </div>
    </div>

    <!-- LE 10 RISPOSTE -->
    <section class="options-board-container">
      <div id="options-board-header" class="options-board-header"></div>
      <div id="options-grid" class="options-grid"></div>
    </section>
  </main>

  <!-- REGOLE -->
  <div id="rules-modal" class="game-modal">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog rules-dialog">
      <div class="modal-header">
        <div id="rules-sub" class="tv-subtitle"></div>
        <h2 id="rules-title" class="modal-title"></h2>
      </div>
      <div class="rules-content">
        <div class="rule-item">
          <span class="rule-badge">1</span>
          <div><strong id="rule1-title"></strong> <span id="rule1-desc"></span></div>
        </div>
        <div class="rule-item">
          <span class="rule-badge">2</span>
          <div><strong id="rule2-title"></strong> <span id="rule2-desc"></span></div>
        </div>
        <div class="rule-item">
          <span class="rule-badge">3</span>
          <div><strong id="rule3-title"></strong> <span id="rule3-desc"></span></div>
        </div>
        <div class="rule-item">
          <span class="rule-badge">4</span>
          <div><strong id="rule4-title"></strong> <span id="rule4-desc"></span></div>
        </div>
      </div>
      <button id="close-rules-btn" class="tv-primary-btn" style="margin-top: 20px;"></button>
    </div>
  </div>

  <!-- VERSIONE PRO (ACQUISTO UNA TANTUM) -->
  <div id="pro-modal" class="game-modal">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog pro-dialog">
      <button id="pro-close-btn" class="modal-close" aria-label="Chiudi">✕</button>
      <div class="pro-crown">👑</div>
      <h2 id="pro-title" class="modal-title">LAST TILE PRO</h2>
      <p id="pro-subtitle" class="pro-subtitle"></p>
      <ul id="pro-benefits" class="pro-benefits"></ul>
      <p id="pro-status" class="pro-status"></p>
      <button id="pro-buy-btn" class="tv-primary-btn pro-buy-btn"></button>
      <button id="pro-restore-btn" class="pro-restore-btn"></button>
      <p id="pro-message" class="pro-message"></p>
    </div>
  </div>

  <!-- ANTEPRIMA PUBBLICITÀ NEL BROWSER / SPAZIO PER IL BANNER NATIVO -->
  <div id="web-ad-bar" class="web-ad-bar" hidden>
    <button id="web-ad-pro-btn" class="web-ad-pro-btn">👑 PRO</button>
  </div>

  <!-- PANNELLO DIAGNOSTICO ANNUNCI (7 TOCCHI SUL LOGO) -->
  <div id="ad-diag" class="ad-diag" hidden>
    <button id="ad-diag-toggle" class="ad-diag-head"></button>
    <div id="ad-diag-log" class="ad-diag-log"></div>
  </div>

  <!-- ESITO DELLA SALA / DELLA SPEDIZIONE -->
  <div id="end-modal" class="game-modal">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog end-dialog">
      <div class="end-dialog-content">
        <h2 id="end-title" class="end-title victory"></h2>
        <div id="end-desc" class="end-desc"></div>
        <div id="end-detail" class="end-detail-box"></div>
        <button id="end-btn" class="tv-primary-btn"></button>
        <button id="end-btn-2" class="tv-primary-btn secondary" hidden></button>
      </div>
    </div>
  </div>

  <script src="/three.min.js"></script>
  <script type="module" src="/js/game.js"></script>
</body>
</html>
